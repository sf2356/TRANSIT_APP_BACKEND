services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      - backend
      - frontend

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - PORT=8080

  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - PORT=8080
      - DB_URL=jdbc:postgresql://postgres:5432/transit_platform
      - DB_USERNAME=transit_app_user
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=https://${DOMAIN}
      - STORAGE_LOCAL_PATH=/data/storage
    volumes:
      - documents_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=transit_platform
      - POSTGRES_USER=transit_app_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit_app_user -d transit_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  documents_storage:
  caddy_data:
  caddy_config: