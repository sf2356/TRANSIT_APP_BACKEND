spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app_transit_db}
    username: ${DB_USERNAME:transit_app_user}
    password: ${DB_PASSWORD:transit_app_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-not-for-production-use-only-local-development-0000}
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:120}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:14}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  storage:
    provider: ${STORAGE_PROVIDER:local}
  seed:
    enabled: true

logging:
  level:
    com.transit.platform: DEBUG
    org.hibernate.SQL: DEBUG
